server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Nginx hace de punto de entrada único: sirve la SPA y enruta /api a cada microservicio.
  location /api/v1/licencias/ {
    proxy_pass http://ant-service:8082;
  }
  location ~ ^/api/v1/(contribuyentes|vehiculos)/ {
    proxy_pass http://sri-service:8081;
  }
  location / {
    try_files $uri /index.html;
  }
}
